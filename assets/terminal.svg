<svg xmlns="http://www.w3.org/2000/svg" width="850" height="270" viewBox="0 0 850 270" role="img" aria-labelledby="title desc">
<title id="title">Sarvesh Raghavan — Terminal Profile</title>
<desc id="desc">Dark terminal with animated lines: whoami, role, currently_building, stack, status</desc>

<rect width="850" height="270" rx="16" fill="#0d1117" stroke="#30363d" stroke-width="1.2"/>

<!-- title bar -->
<rect x="0" y="0" width="850" height="36" rx="16" fill="#161b22"/>
<rect x="0" y="18" width="850" height="18" fill="#161b22"/>
<rect x="1" y="1" width="848" height="34" rx="15" fill="none" stroke="#30363d" stroke-opacity="0.6"/>

<!-- macOS dots -->
<circle cx="28" cy="18" r="6" fill="#ff5f56"/>
<circle cx="50" cy="18" r="6" fill="#ffbd2e"/>
<circle cx="72" cy="18" r="6" fill="#27c93f"/>
<text x="425" y="22" text-anchor="middle" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" letter-spacing="0.3">sarvesh@github — zsh</text>

<!-- terminal content -->
<g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
  <!-- $ whoami -->
  <g opacity="0">
    <text x="26" y="64" fill="#8b949e" font-size="13">$</text>
    <text x="40" y="64" fill="#8b949e" font-size="13">whoami</text>
    <animate attributeName="opacity" values="0;1" dur="0.5s" begin="0.3s" fill="freeze"/>
  </g>
  <g opacity="0">
    <text x="26" y="84" fill="#c9d1d9" font-size="13.5">Sarvesh Raghavan</text>
    <animate attributeName="opacity" values="0;1" dur="0.5s" begin="0.7s" fill="freeze"/>
  </g>

  <!-- $ role -->
  <g opacity="0">
    <text x="26" y="112" fill="#8b949e" font-size="13">$</text>
    <text x="40" y="112" fill="#8b949e" font-size="13">role</text>
    <animate attributeName="opacity" values="0;1" dur="0.5s" begin="1.1s" fill="freeze"/>
  </g>
  <g opacity="0">
    <text x="26" y="132" fill="#7ee787" font-size="13.5">AI/ML Developer</text>
    <animate attributeName="opacity" values="0;1" dur="0.5s" begin="1.5s" fill="freeze"/>
  </g>

  <!-- $ currently_building -->
  <g opacity="0">
    <text x="26" y="160" fill="#8b949e" font-size="13">$</text>
    <text x="40" y="160" fill="#8b949e" font-size="13">currently_building</text>
    <animate attributeName="opacity" values="0;1" dur="0.5s" begin="1.9s" fill="freeze"/>
  </g>
  <g opacity="0">
    <text x="26" y="180" fill="#58a6ff" font-size="13.5">Enterprise RAG + Agentic AI</text>
    <animate attributeName="opacity" values="0;1" dur="0.5s" begin="2.3s" fill="freeze"/>
  </g>

  <!-- $ stack -->
  <g opacity="0">
    <text x="26" y="208" fill="#8b949e" font-size="13">$</text>
    <text x="40" y="208" fill="#8b949e" font-size="13">stack</text>
    <animate attributeName="opacity" values="0;1" dur="0.5s" begin="2.7s" fill="freeze"/>
  </g>
  <g opacity="0">
    <text x="26" y="228" fill="#c9d1d9" font-size="13.5">Python · FastAPI · React · Azure</text>
    <animate attributeName="opacity" values="0;1" dur="0.5s" begin="3.1s" fill="freeze"/>
  </g>

  <!-- $ status -->
  <g opacity="0">
    <text x="26" y="256" fill="#8b949e" font-size="13">$</text>
    <text x="40" y="256" fill="#8b949e" font-size="13">status</text>
    <text x="108" y="256" fill="#3fb950" font-size="13.5" font-weight="600">ONLINE</text>
    <!-- blinking cursor after ONLINE -->
    <rect x="170" y="247" width="7" height="13" rx="1" fill="#3fb950" opacity="0.9">
      <animate attributeName="opacity" values="0.9;0;0.9" dur="1.4s" begin="3.6s" repeatCount="indefinite"/>
    </rect>
    <animate attributeName="opacity" values="0;1" dur="0.5s" begin="3.4s" fill="freeze"/>
  </g>
</g>
</svg>
